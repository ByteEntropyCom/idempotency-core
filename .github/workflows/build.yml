name: Manual Build and Docker Verify

on:
  workflow_dispatch: # Allows you to trigger this manually from the GitHub UI
  push:
    branches: [ main ] # Still runs on push to protect the main branch

jobs:
  quality-and-build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Run All Tests (Unit & Concurrency)
      run: mvn test -B
      env:
        SPRING_REDIS_HOST: localhost
        SPRING_REDIS_PORT: 6379

    - name: Build Application Jar
      run: mvn clean package -DskipTests -B

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image (Local Verify Only)
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true # This loads the image into the local docker daemon instead of pushing it
        tags: idempotency-core:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Confirm Image Build
      run: docker images | grep idempotency-core